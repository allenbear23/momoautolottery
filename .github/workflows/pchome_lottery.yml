name: PChome 24h Lucky Draw

on:
  schedule:
    # 台灣時間 08:05 (UTC 00:05), 12:05 (UTC 04:05), 20:05 (UTC 12:05)
    - cron: '5 0,4,12 * * *'
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run PChome Lucky Draw
        env:
          TZ: 'Asia/Taipei'
          PCHOME_COOKIE: ${{ secrets.PCHOME_COOKIE }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python3 pchome_lottery.py
