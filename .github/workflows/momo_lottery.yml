name: Momo Lottery Auto Draw

on:
  schedule:
    # 台灣時間 (UTC+8): 09:00, 13:00, 16:00, 19:00, 21:00
    # 避開 :00 整點尖峰（避免 GitHub 排程延遲或遺漏），於各時段 :02 與 :20 分雙重觸發備援
    # 09:00 時段 (台灣時間 09:02, 09:20 -> UTC 01:02, 01:20)
    - cron: '2,20 1 * * *'
    # 13:00 時段 (台灣時間 13:02, 13:20 -> UTC 05:02, 05:20)
    - cron: '2,20 5 * * *'
    # 16:00 時段 (台灣時間 16:02, 16:20 -> UTC 08:02, 08:20)
    - cron: '2,20 8 * * *'
    # 19:00 時段 (台灣時間 19:02, 19:20 -> UTC 11:02, 11:20)
    - cron: '2,20 11 * * *'
    # 21:00 時段 (台灣時間 21:02, 21:20 -> UTC 13:02, 13:20)
    - cron: '2,20 13 * * *'
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Momo Draw & Daily Check-in
        env:
          MOMO_COOKIE: ${{ secrets.MOMO_COOKIE }}
          MOMO_EVENT_URL: ${{ vars.MOMO_EVENT_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python3 momo_bot.py --now --silent-if-limit
          python3 momo_checkin.py
