name: Momo Lottery Auto Draw

on:
  schedule:
    # 台灣時間 (UTC+8): 09:00, 13:00, 16:00, 19:00, 21:00
    # 提早於 59 分啟動環境並精確倒數至 00:01 整點搶抽，並於 15 分保留第二道容錯備援
    # 09:00 時段 (台灣時間 08:59, 09:15 -> UTC 00:59, 01:15)
    - cron: '59 0 * * *'
    - cron: '15 1 * * *'
    # 13:00 時段 (台灣時間 12:59, 13:15 -> UTC 04:59, 05:15)
    - cron: '59 4 * * *'
    - cron: '15 5 * * *'
    # 16:00 時段 (台灣時間 15:59, 16:15 -> UTC 07:59, 08:15)
    - cron: '59 7 * * *'
    - cron: '15 8 * * *'
    # 19:00 時段 (台灣時間 18:59, 19:15 -> UTC 10:59, 11:15)
    - cron: '59 10 * * *'
    - cron: '15 11 * * *'
    # 21:00 時段 (台灣時間 20:59, 21:15 -> UTC 12:59, 13:15)
    - cron: '59 12 * * *'
    - cron: '15 13 * * *'
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Momo Draw & Daily Check-in
        env:
          MOMO_COOKIE: ${{ secrets.MOMO_COOKIE }}
          MOMO_EVENT_URL: ${{ vars.MOMO_EVENT_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python3 momo_bot.py --now --silent-if-limit
          python3 momo_checkin.py
