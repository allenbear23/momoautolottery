name: Momo Auto Task

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momo-auto-task
  cancel-in-progress: true

jobs:
  run-tasks:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pillow curl_cffi

      - name: Run Momo Draw, Quiz & Daily Check-in
        env:
          TZ: 'Asia/Taipei'
          MOMO_COOKIE: ${{ secrets.MOMO_COOKIE }}
          MOMO_EVENT_URL: ${{ vars.MOMO_EVENT_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FEEBEE_COOKIE: ${{ secrets.FEEBEE_COOKIE }}
        run: |
          START_HOUR=$(date +%H)
          # python3 momo_quiz.py --now --silent-if-limit --auto-claim || true
          python3 momo_redpacket.py --now --silent-if-limit || true
          # python3 momo_bot.py --now --silent-if-limit || true
          
          # 簽到、轉盤與點數檢查於每日 00 點執行；08 點補跑一次簽到與轉盤 (具備冪等性，避免 00:10 漏觸發)
          if [ "$START_HOUR" = "00" ]; then
            python3 momo_checkin.py || true
            python3 momo_wheel.py --silent-if-limit || true
            python3 momo_coin.py || true
            if [ -n "$FEEBEE_COOKIE" ]; then
              python3 feebee_checkin.py || true
            fi
          elif [ "$START_HOUR" = "08" ]; then
            python3 momo_checkin.py || true
            python3 momo_wheel.py --silent-if-limit || true
          fi

      - name: Commit Quiz DB if updated
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f quiz_db.json ] && [ -n "$(git status --porcelain quiz_db.json)" ]; then
            git add quiz_db.json
            git commit -m "chore: auto update quiz_db [skip ci]" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi

