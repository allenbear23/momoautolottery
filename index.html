<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>momo 雙11 題庫與答題訓練系統</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #ffffff;
      --card-hover: #fafafa;
      --border: #e5e5e5;
      --border-dark: #111111;
      --text: #111111;
      --text-muted: #666666;
      --pink: #ff007f;
      --pink-hover: #e60072;
      --pink-bg: rgba(255, 0, 127, 0.08);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-size: 14px;
      --font-weight: 400;
      --radius: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-weight: var(--font-weight) !important;
      font-size: var(--font-size);
      font-family: var(--font-family);
      letter-spacing: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 60px;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* Top Nav */
    .nav-header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo-group h1 {
      color: var(--pink);
      margin-bottom: 2px;
    }

    .logo-group p {
      color: var(--text-muted);
    }

    .mode-nav {
      display: flex;
      gap: 4px;
      background: #ffffff;
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .nav-btn:hover {
      color: var(--text);
      border-color: var(--border);
    }

    .nav-btn.active {
      background: var(--pink);
      color: #ffffff;
      border-color: var(--pink);
    }

    /* Stats Overview Pills */
    .stats-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .stat-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill span {
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--text);
    }

    /* Views */
    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    /* VIEW 1: PRACTICE MODE (EXACT MOMO IN-GAME LAYOUT) */
    .practice-container {
      max-width: 440px;
      margin: 0 auto;
    }

    .practice-controls {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .mode-select-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .mode-chip {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .mode-chip:hover {
      color: var(--text);
      border-color: var(--border-dark);
    }

    .mode-chip.active {
      background: var(--pink-bg);
      border-color: var(--pink);
      color: var(--pink);
    }

    /* Real Momo Phone Frame Layout */
    .momo-game-frame {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: var(--radius);
      padding: 20px 16px;
      position: relative;
    }

    .momo-top-banner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .momo-title-area .game-main-title {
      color: var(--pink);
      margin-bottom: 2px;
    }

    .momo-title-area .game-sub-title {
      color: var(--text-muted);
    }

    .momo-timer-badge {
      border: 1px solid var(--pink);
      color: var(--pink);
      background: var(--pink-bg);
      padding: 4px 12px;
      border-radius: var(--radius);
      text-align: center;
      min-width: 60px;
    }

    .momo-rule-tip {
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .momo-q-heading {
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .momo-q-text {
      color: var(--text);
      line-height: 1.5;
      margin-bottom: 14px;
      min-height: 42px;
    }

    .momo-q-img-wrap {
      max-height: 240px;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      cursor: zoom-in;
    }

    .momo-q-img-wrap img {
      max-height: 240px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
    }

    /* 4 Momo Answer Slots */
    .momo-options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .momo-opt-row {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
    }

    .momo-opt-row:hover:not(.disabled) {
      border-color: var(--border-dark);
      background: #fafafa;
    }

    .momo-num-badge {
      width: 24px;
      height: 24px;
      border-radius: var(--radius);
      background: #f5f5f5;
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .momo-opt-content {
      flex: 1;
      color: var(--text);
    }

    .momo-opt-img-thumb {
      max-height: 120px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      margin: 4px 0;
    }

    .momo-opt-row.correct {
      background: var(--pink-bg) !important;
      border-color: var(--pink) !important;
      color: var(--pink) !important;
    }

    .momo-opt-row.correct .momo-num-badge {
      background: var(--pink);
      color: #ffffff;
      border-color: var(--pink);
    }

    .momo-opt-row.wrong {
      background: #fef2f2 !important;
      border-color: #ef4444 !important;
      color: #dc2626 !important;
    }

    .momo-opt-row.wrong .momo-num-badge {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }

    /* Momo In-Game Result Bar */
    .momo-result-banner {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fafafa;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .momo-result-text {
      color: var(--text);
    }

    .momo-confirm-btn {
      width: 100%;
      background: var(--pink);
      color: #ffffff;
      border: 1px solid var(--pink);
      padding: 12px;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 10px;
      text-align: center;
    }

    .momo-confirm-btn:hover {
      background: var(--pink-hover);
    }

    .momo-summary-wrap {
      text-align: center;
      padding: 30px 16px;
    }

    .momo-summary-score {
      color: var(--pink);
      margin: 8px 0 16px;
    }

    /* VIEW 2: BROWSE & REPORT MODE */
    .toolbar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      position: sticky;
      top: 10px;
      z-index: 90;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
    }

    .search-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--text);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--pink);
    }

    .filter-tabs {
      display: flex;
      gap: 4px;
      background: #ffffff;
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--pink);
      color: #ffffff;
      border-color: var(--pink);
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 768px) {
      .quiz-card.has-media {
        grid-template-columns: 200px 1fr;
        align-items: start;
      }
    }

    .quiz-card:hover {
      border-color: #cccccc;
    }

    .media-box {
      width: 100%;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
      position: relative;
      max-height: 240px;
    }

    .media-box img {
      width: 100%;
      height: auto;
      max-height: 240px;
      object-fit: contain;
      display: block;
    }

    .card-content {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .question-title {
      line-height: 1.5;
      color: var(--text);
    }

    .badge-group {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .status-badge {
      padding: 2px 8px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-muted);
    }

    .badge-verified {
      border-color: var(--pink);
      color: var(--pink);
      background: var(--pink-bg);
    }

    .badge-pending {
      border-color: var(--border);
      color: var(--text-muted);
    }

    .badge-img {
      border-color: var(--border);
      color: var(--text);
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: var(--radius);
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 6px;
    }

    .option-item {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .option-item:hover {
      border-color: var(--border-dark);
      color: var(--text);
    }

    .option-item.correct {
      background: var(--pink-bg);
      border-color: var(--pink);
      color: var(--pink);
    }

    .option-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #cccccc;
      flex-shrink: 0;
    }

    .option-item.correct .option-dot {
      background: var(--pink);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .action-btn:hover {
      border-color: var(--border-dark);
    }

    .action-btn.btn-confirm {
      border-color: var(--pink);
      color: var(--pink);
    }

    .action-btn.btn-confirm:hover {
      background: var(--pink-bg);
    }

    /* VIEW 3: UPLOAD & CROWDSOURCE */
    .upload-container {
      max-width: 640px;
      margin: 0 auto;
    }

    .upload-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .upload-dropzone {
      border: 1px dashed var(--pink);
      background: #ffffff;
      border-radius: var(--radius);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .upload-dropzone:hover, .upload-dropzone.dragover {
      background: var(--pink-bg);
    }

    .dropzone-text {
      color: var(--text);
      margin-bottom: 4px;
    }

    .dropzone-subtext {
      color: var(--text-muted);
    }

    .upload-preview {
      display: none;
      margin-bottom: 16px;
      text-align: center;
    }

    .upload-preview img {
      max-height: 240px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      color: var(--text);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--pink);
    }

    .btn-submit-upload {
      width: 100%;
      background: var(--pink);
      color: #ffffff;
      border: 1px solid var(--pink);
      padding: 10px;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-submit-upload:hover {
      background: var(--pink-hover);
    }

    /* Lightbox Modal */
    .image-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      cursor: zoom-out;
    }

    .image-modal.open {
      display: flex;
    }

    .image-modal img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: default;
      background: #ffffff;
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Top Nav Header -->
    <header class="nav-header">
      <div class="logo-group">
        <h1>momo 雙11 題庫系統</h1>
        <p>社群協作題庫與答題訓練系統</p>
      </div>

      <nav class="mode-nav">
        <button class="nav-btn active" data-view="practice" id="btnNavPractice">
          答題訓練
        </button>
        <button class="nav-btn" data-view="browse" id="btnNavBrowse">
          題庫總覽
        </button>
        <button class="nav-btn" data-view="upload" id="btnNavUpload">
          上傳截圖
        </button>
      </nav>
    </header>

    <!-- Global Stats Pills -->
    <div class="stats-bar">
      <div class="stat-pill">
        <span>題庫總量</span>
        <strong id="statTotal">--</strong>
      </div>
      <div class="stat-pill">
        <span>已確認解答</span>
        <strong id="statVerified" style="color: var(--pink);">--</strong>
      </div>
      <div class="stat-pill">
        <span>待協作確認</span>
        <strong id="statPending">--</strong>
      </div>
      <div class="stat-pill">
        <span>含截圖題目</span>
        <strong id="statMedia">--</strong>
      </div>
    </div>

    <!-- VIEW 1: PRACTICE MODE (EXACT REAL MOMO QUESTION SCREEN) -->
    <section id="viewPractice" class="view-section active">
      <div class="practice-container">
        <!-- Controls Header -->
        <div class="practice-controls">
          <div class="mode-select-group">
            <button class="mode-chip active" data-mode="sprint10">10 題速測</button>
            <button class="mode-chip" data-mode="infinite">自由刷題</button>
            <button class="mode-chip" data-mode="unverified">待確認題</button>
            <button class="mode-chip" data-mode="visual">圖片題專練</button>
            <button class="mode-chip" data-mode="wrong">錯題複習</button>
          </div>
          <button class="action-btn" onclick="startNewSession()">重新開始</button>
        </div>

        <!-- Phone In-Game Replica Container -->
        <div class="momo-game-frame" id="arenaCard">
          <!-- Top Status Bar -->
          <div class="momo-top-banner">
            <div class="momo-title-area">
              <div class="game-main-title">momo知識王</div>
              <div class="game-sub-title">天天答題賺$50 · 第 <span id="arenaIdx">1</span> / <span id="arenaTotal">10</span> 題</div>
            </div>
            <div class="momo-timer-badge">
              <span id="arenaTimer">60</span> 秒
            </div>
          </div>

          <!-- Official Momo Reminder Text -->
          <div class="momo-rule-tip">
            ※遊戲開始時，請勿重新整理頁面，避免無法遊玩
          </div>

          <!-- Question Section -->
          <div class="momo-q-heading">請回答下列問題</div>
          <div class="momo-q-text" id="arenaQuestionText">題目載入中...</div>

          <!-- Question Image if available -->
          <div class="momo-q-img-wrap" id="arenaMediaBox" style="display: none;" onclick="openArenaModal()">
            <img id="arenaImg" src="" alt="題目附圖">
          </div>

          <!-- 4 Options Rows -->
          <div class="momo-options-list" id="arenaOptionsGrid"></div>

          <!-- Feedback Bar -->
          <div class="momo-result-banner" id="arenaFeedbackBar" style="display: none;">
            <div class="momo-result-text" id="feedbackText"></div>
            <button class="action-btn" id="btnReportFromArena" onclick="reportCorrectChoice()">
              標記正解
            </button>
          </div>

          <!-- Next Button -->
          <button class="momo-confirm-btn" id="btnNext" style="display: none;" onclick="nextQuestion()">
            確認答案 (下一題)
          </button>
        </div>

        <!-- Game Over Summary -->
        <div class="momo-game-frame momo-summary-wrap" id="summaryCard" style="display: none;">
          <div>遊戲結束</div>
          <div class="momo-summary-score" id="summaryScore">0分</div>
          <p id="summaryDesc" style="color: var(--text-muted); margin-bottom: 16px;">完成答題</p>
          <div style="display: flex; gap: 8px; justify-content: center;">
            <button class="action-btn btn-confirm" onclick="startNewSession()">再玩一次</button>
            <button class="action-btn" onclick="switchNav('browse')">題庫總覽</button>
          </div>
        </div>
      </div>
    </section>

    <!-- VIEW 2: BROWSE & REPORT MODE -->
    <section id="viewBrowse" class="view-section">
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" class="search-input" placeholder="搜尋題幹、關鍵字、選項...">
        </div>

        <div class="filter-tabs">
          <button class="tab-btn active" data-filter="all">全部</button>
          <button class="tab-btn" data-filter="verified">已確認正解</button>
          <button class="tab-btn" data-filter="pending">待協作確認</button>
          <button class="tab-btn" data-filter="media">含截圖</button>
          <button class="tab-btn" data-filter="visual">純圖片選項</button>
        </div>
      </div>

      <!-- Card List -->
      <div class="cards-list" id="cardsList"></div>
    </section>

    <!-- VIEW 3: UPLOAD & CROWDSOURCE -->
    <section id="viewUpload" class="view-section">
      <div class="upload-container">
        <div class="upload-card">
          <div style="margin-bottom: 4px;">上傳題目與截圖</div>
          <p style="color: var(--text-muted); margin-bottom: 16px;">
            可貼上或選取截圖，送出後將同步加入題庫協作。
          </p>

          <!-- Dropzone -->
          <div class="upload-dropzone" id="uploadDropzone">
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <div class="dropzone-text">點擊選擇圖片，或拖曳圖片至此</div>
            <div class="dropzone-subtext">支援直接按下 Ctrl+V / Cmd+V 貼上截圖</div>
          </div>

          <!-- Preview -->
          <div class="upload-preview" id="uploadPreviewBox">
            <img id="uploadPreviewImg" src="" alt="預覽截圖">
          </div>

          <div class="form-group">
            <label class="form-label">題目文字 (若為圖片題可留空)</label>
            <input type="text" id="inputQuestionText" class="form-input" placeholder="輸入題目文字">
          </div>

          <div class="form-group">
            <label class="form-label">選項 1</label>
            <input type="text" id="inputOpt1" class="form-input" placeholder="選項 1">
          </div>
          <div class="form-group">
            <label class="form-label">選項 2</label>
            <input type="text" id="inputOpt2" class="form-input" placeholder="選項 2">
          </div>
          <div class="form-group">
            <label class="form-label">選項 3</label>
            <input type="text" id="inputOpt3" class="form-input" placeholder="選項 3">
          </div>
          <div class="form-group">
            <label class="form-label">選項 4</label>
            <input type="text" id="inputOpt4" class="form-input" placeholder="選項 4">
          </div>

          <div class="form-group">
            <label class="form-label">已知正確答案 (選填)</label>
            <input type="text" id="inputCorrect" class="form-input" placeholder="輸入正確答案文字">
          </div>

          <button class="btn-submit-upload" id="btnSubmitUpload" onclick="submitUploadQuestion()">
            確認送出
          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- Fullscreen Lightbox Modal -->
  <div class="image-modal" id="imageModal" onclick="closeImageModal()">
    <button class="modal-close-btn" onclick="closeImageModal()">&times;</button>
    <img id="modalImg" src="" alt="放大預覽" onclick="event.stopPropagation()">
  </div>

  <!-- Static Fallback Data -->
  <script src="quiz_data.js"></script>
  <script>
    let quizData = [];
    let currentPracticeMode = 'sprint10';
    let practiceQueue = [];
    let practiceIndex = 0;
    let practiceStreak = 0;
    let practiceScore = 0;
    let practiceWrongSet = new Set();
    let currentSelectedOpt = null;
    let arenaAnswered = false;
    let timerInterval = null;
    let timerSeconds = 60;

    let browseFilter = 'all';
    let browseSearch = '';
    let uploadedFileB64 = null;
    let uploadedFileName = '';

    async function init() {
      try {
        const resp = await fetch('/api/questions');
        if (resp.ok) {
          const json = await resp.json();
          parseRawDb(json);
        } else {
          fallbackLocalData();
        }
      } catch (e) {
        fallbackLocalData();
      }

      setupEvents();
      startNewSession();
      renderBrowseList();
    }

    function fallbackLocalData() {
      if (window.QUIZ_DATA) {
        parseRawDb(window.QUIZ_DATA);
      }
    }

    function parseRawDb(db) {
      const qObj = db.questions || {};
      quizData = Object.keys(qObj).map(k => {
        const item = qObj[k];
        return {
          key: k,
          text: item.text || k,
          image: item.image || '',
          screenshot: item.screenshot || '',
          choices: item.choices || [],
          correct: item.correct || null,
          wrong: item.wrong || [],
          updated_at: item.updated_at || ''
        };
      });

      updateStats();
    }

    function updateStats() {
      document.getElementById('statTotal').innerText = quizData.length;
      document.getElementById('statVerified').innerText = quizData.filter(q => q.correct).length;
      document.getElementById('statPending').innerText = quizData.filter(q => !q.correct).length;
      document.getElementById('statMedia').innerText = quizData.filter(q => q.screenshot || q.image).length;
    }

    function startNewSession() {
      clearInterval(timerInterval);
      arenaAnswered = false;
      document.getElementById('arenaCard').style.display = 'block';
      document.getElementById('summaryCard').style.display = 'none';

      let pool = [...quizData];
      if (currentPracticeMode === 'unverified') {
        pool = pool.filter(q => !q.correct);
      } else if (currentPracticeMode === 'visual') {
        pool = pool.filter(q => q.screenshot || q.image || q.choices.some(c => c.image));
      } else if (currentPracticeMode === 'wrong') {
        pool = pool.filter(q => practiceWrongSet.has(q.key) || (q.wrong && q.wrong.length > 0));
      }

      if (pool.length === 0) pool = [...quizData];
      pool.sort(() => Math.random() - 0.5);

      if (currentPracticeMode === 'sprint10') {
        practiceQueue = pool.slice(0, 10);
        timerSeconds = 60;
        document.getElementById('arenaTimer').innerText = timerSeconds;
        startTimer();
      } else {
        practiceQueue = pool;
        document.getElementById('arenaTimer').innerText = '--';
      }

      practiceIndex = 0;
      practiceStreak = 0;
      practiceScore = 0;
      renderArenaQuestion();
    }

    function startTimer() {
      const timerEl = document.getElementById('arenaTimer');
      timerEl.innerText = timerSeconds;
      timerInterval = setInterval(() => {
        timerSeconds--;
        timerEl.innerText = timerSeconds;
        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          finishSession();
        }
      }, 1000);
    }

    function renderArenaQuestion() {
      if (practiceIndex >= practiceQueue.length) {
        finishSession();
        return;
      }

      arenaAnswered = false;
      currentSelectedOpt = null;
      document.getElementById('arenaFeedbackBar').style.display = 'none';
      document.getElementById('btnNext').style.display = 'none';

      const q = practiceQueue[practiceIndex];
      document.getElementById('arenaIdx').innerText = practiceIndex + 1;
      document.getElementById('arenaTotal').innerText = practiceQueue.length;
      document.getElementById('arenaQuestionText').innerText = q.text;

      const mediaBox = document.getElementById('arenaMediaBox');
      const arenaImg = document.getElementById('arenaImg');
      const imgSrc = q.screenshot || q.image;

      if (imgSrc) {
        arenaImg.src = imgSrc;
        mediaBox.style.display = 'flex';
      } else {
        mediaBox.style.display = 'none';
      }

      const optGrid = document.getElementById('arenaOptionsGrid');
      optGrid.innerHTML = '';

      let choices = q.choices || [];

      if (choices.length === 0) {
        optGrid.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); padding: 16px;">
            本題尚無預設選項文字，請檢視截圖並於下方回報。
          </div>
        `;
        document.getElementById('arenaFeedbackBar').style.display = 'flex';
        document.getElementById('feedbackText').innerHTML = `<span>本題尚待協作</span>`;
        return;
      }

      choices.forEach((c, i) => {
        const row = document.createElement('div');
        row.className = 'momo-opt-row';
        row.dataset.idx = i;

        let contentHtml = `<span class="momo-num-badge">${i + 1}</span>`;
        if (c.image) {
          contentHtml += `
            <div class="momo-opt-content">
              <img src="${c.image}" alt="選項圖片" class="momo-opt-img-thumb">
              <div>${escapeHtml(c.text || `圖片選項 ${i + 1}`)}</div>
            </div>
          `;
        } else {
          contentHtml += `<div class="momo-opt-content">${escapeHtml(c.text || `選項 ${i + 1}`)}</div>`;
        }

        row.innerHTML = contentHtml;
        row.onclick = () => selectOption(i, c, q);
        optGrid.appendChild(row);
      });
    }

    function selectOption(idx, choiceObj, q) {
      if (arenaAnswered) return;
      arenaAnswered = true;
      currentSelectedOpt = choiceObj;

      const optRows = document.querySelectorAll('.momo-opt-row');
      const chosenRow = optRows[idx];

      const targetText = q.correct ? (q.correct.text || q.correct) : null;
      const targetUuid = q.correct ? q.correct.uuid : null;
      const targetImg = q.correct ? q.correct.image : null;

      let isCorrect = false;
      if (targetText && choiceObj.text && (choiceObj.text === targetText || targetText.includes(choiceObj.text) || choiceObj.text.includes(targetText))) {
        isCorrect = true;
      } else if (targetUuid && choiceObj.uuid === targetUuid) {
        isCorrect = true;
      } else if (targetImg && choiceObj.image && targetImg.split('/').pop() === choiceObj.image.split('/').pop()) {
        isCorrect = true;
      }

      const isUnverified = !q.correct;

      if (isCorrect) {
        chosenRow.classList.add('correct');
        practiceStreak++;
        practiceScore += 10;
        showFeedback(true, `答對囉！ 答對${practiceStreak}題 +${practiceScore}分`);
      } else if (isUnverified) {
        chosenRow.classList.add('correct');
        showFeedback(null, `已選取：${choiceObj.text || `選項 ${idx+1}`} (待確認)`);
      } else {
        chosenRow.classList.add('wrong');
        practiceStreak = 0;
        practiceWrongSet.add(q.key);
        optRows.forEach((r, i) => {
          const c = q.choices[i];
          if (c && targetText && (c.text === targetText || targetText.includes(c.text) || c.text.includes(targetText))) {
            r.classList.add('correct');
          }
        });
        showFeedback(false, `答錯囉！正解為：${escapeHtml(targetText || '已標記選項')}`);
      }

      document.getElementById('btnNext').style.display = 'block';
    }

    function showFeedback(status, msg) {
      const bar = document.getElementById('arenaFeedbackBar');
      const txt = document.getElementById('feedbackText');
      bar.style.display = 'flex';

      if (status === true) {
        txt.innerHTML = `<span style="color: var(--pink);">${msg}</span>`;
      } else if (status === false) {
        txt.innerHTML = `<span style="color: #dc2626;">${msg}</span>`;
      } else {
        txt.innerHTML = `<span style="color: var(--text-muted);">${msg}</span>`;
      }
    }

    function nextQuestion() {
      practiceIndex++;
      renderArenaQuestion();
    }

    function finishSession() {
      clearInterval(timerInterval);
      document.getElementById('arenaCard').style.display = 'none';
      document.getElementById('summaryCard').style.display = 'block';
      document.getElementById('summaryScore').innerText = `答對 ${practiceScore / 10} 題 +${practiceScore}分`;
      document.getElementById('summaryDesc').innerText = `本輪測驗結束，累計得分: ${practiceScore} 分`;
    }

    async function reportCorrectChoice() {
      if (!currentSelectedOpt) {
        alert('請先點選選項');
        return;
      }
      const q = practiceQueue[practiceIndex];
      const payload = {
        question_key: q.key,
        correct: {
          text: currentSelectedOpt.text || '',
          uuid: currentSelectedOpt.uuid || '',
          image: currentSelectedOpt.image || ''
        }
      };

      try {
        const resp = await fetch('/api/report_answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (resp.ok) {
          q.correct = payload.correct;
          updateStats();
          alert(`已成功將「${currentSelectedOpt.text || '所選項'}」設定為正解`);
        } else {
          alert('儲存失敗');
        }
      } catch (e) {
        alert('無法連線至伺服器');
      }
    }

    function renderBrowseList() {
      const container = document.getElementById('cardsList');
      const filtered = quizData.filter(q => {
        if (browseSearch) {
          const s = browseSearch.toLowerCase();
          const matchQ = q.text.toLowerCase().includes(s);
          const matchOpts = q.choices.some(c => (c.text || '').toLowerCase().includes(s));
          if (!matchQ && !matchOpts) return false;
        }

        if (browseFilter === 'verified') return !!q.correct;
        if (browseFilter === 'pending') return !q.correct;
        if (browseFilter === 'media') return !!(q.screenshot || q.image);
        if (browseFilter === 'visual') return q.choices.some(c => c.image);
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; color: var(--text-muted); padding: 40px 16px;">
            無符合條件題目
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((item, idx) => {
        const imgSrc = item.screenshot || item.image;
        const correctText = item.correct ? (item.correct.text || item.correct) : null;
        const isVerified = !!item.correct;

        let mediaHtml = '';
        if (imgSrc) {
          mediaHtml = `
            <div class="media-box" onclick="openImageModal('${imgSrc}')">
              <img src="${imgSrc}" alt="題目截圖" loading="lazy">
            </div>
          `;
        }

        let choicesHtml = '';
        if (item.choices && item.choices.length > 0) {
          choicesHtml = `
            <div class="options-grid">
              ${item.choices.map((c, cIdx) => {
                const text = c.text || `[圖片選項 ${cIdx + 1}]`;
                const isThisCorrect = correctText && (text === correctText || correctText.includes(text) || text.includes(correctText));
                let cls = 'option-item' + (isThisCorrect ? ' correct' : '');

                return `
                  <div class="${cls}" onclick="quickReportChoice('${escapeHtml(item.key)}', '${escapeHtml(text)}')">
                    <span class="option-dot"></span>
                    <span>${escapeHtml(text)}</span>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else if (correctText) {
          choicesHtml = `
            <div class="options-grid">
              <div class="option-item correct">
                <span class="option-dot"></span>
                <span>正確解答：${escapeHtml(correctText)}</span>
              </div>
            </div>
          `;
        }

        return `
          <article class="quiz-card ${imgSrc ? 'has-media' : ''}">
            ${mediaHtml}
            <div class="card-content">
              <div class="card-header">
                <div class="question-title">
                  <span style="color: var(--pink); margin-right: 6px;">#${idx + 1}</span>
                  <span>${escapeHtml(item.text)}</span>
                </div>
                <div class="badge-group">
                  ${imgSrc ? '<span class="badge-img">截圖</span>' : ''}
                  <span class="status-badge ${isVerified ? 'badge-verified' : 'badge-pending'}">
                    ${isVerified ? '已確認' : '待確認'}
                  </span>
                </div>
              </div>

              ${choicesHtml}

              <div class="card-footer">
                <span>更新時間：${escapeHtml(item.updated_at || '無')}</span>
                <div class="card-actions">
                  <button class="action-btn btn-confirm" onclick="promptReportAnswer('${escapeHtml(item.key)}')">
                    標記正解
                  </button>
                  <button class="action-btn" onclick="copyCardText('${escapeHtml(item.text)}', '${escapeHtml(correctText || '未確認')}')">
                    複製題答
                  </button>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function quickReportChoice(key, choiceText) {
      if (!confirm(`確定要將「${choiceText}」標記為正確答案嗎？`)) return;
      await sendReport(key, { text: choiceText });
    }

    async function promptReportAnswer(key) {
      const q = quizData.find(item => item.key === key);
      const curr = q && q.correct ? (q.correct.text || q.correct) : '';
      const ans = prompt(`請輸入本題正確答案：\n${q ? q.text : key}`, curr);
      if (ans && ans.trim()) {
        await sendReport(key, { text: ans.trim() });
      }
    }

    async function sendReport(key, correctObj) {
      try {
        const resp = await fetch('/api/report_answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question_key: key, correct: correctObj })
        });
        if (resp.ok) {
          const q = quizData.find(item => item.key === key);
          if (q) q.correct = correctObj;
          updateStats();
          renderBrowseList();
          alert('已更新正解');
        } else {
          alert('伺服器回應異常');
        }
      } catch (e) {
        alert('請確認 view_quiz.py 伺服器正在執行');
      }
    }

    function setupEvents() {
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.onclick = () => switchNav(b.dataset.view);
      });

      document.querySelectorAll('.mode-chip').forEach(c => {
        c.onclick = () => {
          document.querySelectorAll('.mode-chip').forEach(x => x.classList.remove('active'));
          c.classList.add('active');
          currentPracticeMode = c.dataset.mode;
          startNewSession();
        };
      });

      document.getElementById('searchInput').oninput = (e) => {
        browseSearch = e.target.value.trim();
        renderBrowseList();
      };

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
          btn.classList.add('active');
          browseFilter = btn.dataset.filter;
          renderBrowseList();
        };
      });

      const dropzone = document.getElementById('uploadDropzone');
      const fileInput = document.getElementById('fileInput');

      dropzone.onclick = () => fileInput.click();
      fileInput.onchange = (e) => handleFileSelect(e.target.files[0]);

      dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('dragover'); };
      dropzone.ondragleave = () => dropzone.classList.remove('dragover');
      dropzone.ondrop = (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFileSelect(e.dataTransfer.files[0]);
        }
      };

      window.addEventListener('paste', (e) => {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let item of items) {
          if (item.kind === 'file' && item.type.startsWith('image/')) {
            const blob = item.getAsFile();
            handleFileSelect(blob);
            switchNav('upload');
            break;
          }
        }
      });

      window.addEventListener('keydown', (e) => {
        if (document.getElementById('viewPractice').classList.contains('active')) {
          if (['1', '2', '3', '4'].includes(e.key)) {
            const idx = parseInt(e.key) - 1;
            const rows = document.querySelectorAll('.momo-opt-row');
            if (rows[idx] && !arenaAnswered) rows[idx].click();
          } else if (e.code === 'Space' || e.key === 'Enter') {
            e.preventDefault();
            if (arenaAnswered) nextQuestion();
          }
        }
      });
    }

    function handleFileSelect(file) {
      if (!file) return;
      uploadedFileName = file.name || `upload_${Date.now()}.png`;

      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedFileB64 = e.target.result;
        document.getElementById('uploadPreviewImg').src = uploadedFileB64;
        document.getElementById('uploadPreviewBox').style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    async function submitUploadQuestion() {
      const qText = document.getElementById('inputQuestionText').value.trim();
      const o1 = document.getElementById('inputOpt1').value.trim();
      const o2 = document.getElementById('inputOpt2').value.trim();
      const o3 = document.getElementById('inputOpt3').value.trim();
      const o4 = document.getElementById('inputOpt4').value.trim();
      const corr = document.getElementById('inputCorrect').value.trim();

      if (!qText && !uploadedFileB64) {
        alert('請至少填寫題目文字或提供截圖');
        return;
      }

      const choices = [o1, o2, o3, o4].filter(x => !!x).map((t, idx) => ({ text: t, index: idx + 1 }));

      const payload = {
        question_text: qText || '待確認題目 (見截圖)',
        image_base64: uploadedFileB64 || null,
        image_name: uploadedFileName,
        choices: choices,
        correct_text: corr || null
      };

      try {
        const resp = await fetch('/api/upload_question', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (resp.ok) {
          const res = await resp.json();
          alert('上傳成功');
          document.getElementById('inputQuestionText').value = '';
          document.getElementById('inputOpt1').value = '';
          document.getElementById('inputOpt2').value = '';
          document.getElementById('inputOpt3').value = '';
          document.getElementById('inputOpt4').value = '';
          document.getElementById('inputCorrect').value = '';
          uploadedFileB64 = null;
          document.getElementById('uploadPreviewBox').style.display = 'none';

          if (res.new_question) {
            quizData.unshift(res.new_question);
            updateStats();
          }
          switchNav('browse');
        } else {
          alert('上傳失敗');
        }
      } catch (e) {
        alert('無法連線至伺服器');
      }
    }

    function switchNav(viewName) {
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.view === viewName);
      });
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));

      if (viewName === 'practice') {
        document.getElementById('viewPractice').classList.add('active');
      } else if (viewName === 'browse') {
        document.getElementById('viewBrowse').classList.add('active');
        renderBrowseList();
      } else if (viewName === 'upload') {
        document.getElementById('viewUpload').classList.add('active');
      }
    }

    function openImageModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imageModal').classList.add('open');
    }

    function openArenaModal() {
      const src = document.getElementById('arenaImg').src;
      if (src) openImageModal(src);
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('open');
    }

    function copyCardText(q, a) {
      const text = `題目：${q}\n答案：${a}`;
      navigator.clipboard.writeText(text).then(() => alert('已複製'));
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    init();
  </script>
</body>
